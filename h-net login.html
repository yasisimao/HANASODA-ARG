<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H-NET LOGIN</title>

<style>
body {
  margin: 0;
  background: #050505;
  color: #bbb;
  font-family: monospace;
}

.container {
  max-width: 420px;
  margin: 150px auto;
  padding: 30px;
  border: 1px solid #333;
}

h1 {
  font-weight: normal;
  letter-spacing: 3px;
}

label {
  display: block;
  margin-top: 25px;
  margin-bottom: 8px;
  color: #666;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  background: #0d0d0d;
  border: 1px solid #444;
  color: white;
  font-family: monospace;
}

button {
  margin-top: 30px;
  width: 100%;
  padding: 13px;
  background: #111;
  border: 1px solid #555;
  color: #bbb;
  font-family: monospace;
  cursor: pointer;
}

button:hover {
  background: #222;
}

#error {
  margin-top: 20px;
  color: #777;
}
</style>
</head>

<body>

<div class="container">

<h1>H-NET LOGIN</h1>

<label>ACCOUNT</label>
<input id="account" type="text">

<label>PASSWORD</label>
<input id="password" type="password">

<button onclick="login()">
LOGIN
</button>

<div id="error"></div>

</div>

<script>

function login() {

  const account =
    document.getElementById("account").value.trim();

  const password =
    document.getElementById("password").value.trim();

  if (
    account.toUpperCase() === "HORNET" &&
    password.toLowerCase() === "gajumaru"
  ) {

    location.href = "h-net hornet.html";

  } else {

    document.getElementById("error").textContent =
      "ACCESS DENIED.";

  }

}

</script>

</body>
</html>
