<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>花咲く場所で希望を育てて</title>

<style>

/* =========================
   共通
========================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Times New Roman",
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;

    background:#f8f7f2;
    color:#333;
    overflow-x:hidden;
}

a{
    color:inherit;
}


/* =========================
   ヘッダー
========================= */

header{
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 7%;

    border-bottom:1px solid #ddd;

    background:rgba(255,255,255,0.8);
}

.logo{
    font-size:18px;
    letter-spacing:0.15em;
}

nav a{
    margin-left:25px;

    color:#555;
    text-decoration:none;

    font-size:13px;

    transition:color .2s;
}

nav a:hover{
    color:#222;
}


/* =========================
   メインビジュアル
========================= */

.hero{
    min-height:75vh;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:60px 20px;
}

.hero h1{
    font-size:clamp(30px,6vw,58px);

    font-weight:normal;

    letter-spacing:0.12em;

    line-height:1.6;

    margin:0 0 25px;
}

.hero p{
    line-height:2;

    color:#777;

    font-size:14px;

    margin:0;
}



/* =========================
   フッター
========================= */

footer{
    text-align:center;

    padding:30px;

    color:#999;

    font-size:11px;

    border-top:1px solid #ddd;
}


/* =========================
   スマートフォン
========================= */

@media(max-width:768px){

    header{
        padding:0 20px;
    }

    .logo{
        font-size:14px;
        letter-spacing:0.1em;
    }

    nav a{
        margin-left:10px;
        font-size:11px;
    }

    .hero{
        min-height:calc(100vh - 70px);
        padding:40px 20px;
    }

    .hero h1{
        font-size:28px;
        letter-spacing:4px;
    }

    .hero p{
        font-size:13px;
    }

}

@media(max-width:500px){

    header{
        height:auto;
        min-height:70px;

        flex-direction:column;
        justify-content:center;

        gap:10px;

        padding:15px 10px;
    }

    nav a{
        margin:0 6px;
    }

    .hero{
        min-height:calc(100vh - 100px);
    }

}

</style>
</head>


<body>


<!-- =====================================================
     通常サイト
===================================================== -->

<div id="normalSite">


    <!-- =========================
         ヘッダー
    ========================== -->

    <header>

        <div class="logo">
            花咲く場所で希望を育てて
        </div>

        <nav>

            <a href="#">
                あらすじ
            </a>

            <a href="#">
                キャラクター
            </a>

            <a href="#">
                ニュース
            </a>

            <a href="seach.html">
                検索
            </a>

        </nav>

    </header>



    <!-- =========================
         メイン
    ========================== -->

    <section class="hero">

        <div>
<br><br><br><br><br>
            <h1>
                花咲く場所で<br>
                希望を育てて
            </h1>

            <p>
                傷ついた少女と、<br>
                彼女に手を差し伸べた少女の物語。
            </p>
<br><br><br><br><br><br><br><br><br><br><br>
  <h2>あらすじ</h2>

  <p>
孤独と後悔を抱えながら生きる茅野咲希(かやのさき)。彼女の前に現れたのは、太陽のように明るい栗栖川妃梨(くりすがわひな)だった。<br>
過去に囚われ続ける咲希を、妃梨はそばで支えようと決意する。彼女の存在は咲希にとって初めての安らぎとなり、少しずつ心を開いていく。<br>
これは、過去に傷ついた少女が、希望を見つける物語。
  </p>


        </div>

    </section>



    <!-- =========================
         フッター
    ========================== -->

    <footer>
        © 花咲く場所で希望を育てて
    </footer>


</div>


</body>
</html>
