<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H-NET</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #070707;
  color: #bbb;
  font-family: monospace;
}

header {
  height: 70px;
  border-bottom: 1px solid #333;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
}

.logo {
  letter-spacing: 4px;
  color: #ddd;
}

.login {
  color: #aaa;
  text-decoration: none;
  border: 1px solid #555;
  padding: 10px 18px;
}

.login:hover {
  color: white;
  border-color: #aaa;
}

.container {
  max-width: 850px;
  margin: 70px auto;
  padding: 30px;
}

h1 {
  font-size: 28px;
  font-weight: normal;
}

.subtitle {
  color: #666;
  margin-bottom: 60px;
}

.panel {
  border: 1px solid #333;
  padding: 30px;
}

.panel h2 {
  font-weight: normal;
  letter-spacing: 2px;
}

label {
  display: block;
  margin-top: 25px;
  margin-bottom: 8px;
  color: #777;
}

input,
textarea {
  width: 100%;
  background: #0d0d0d;
  border: 1px solid #444;
  color: #ddd;
  padding: 12px;
  font-family: monospace;
}

textarea {
  min-height: 150px;
  resize: vertical;
}

button {
  margin-top: 25px;
  background: #111;
  border: 1px solid #555;
  color: #bbb;
  padding: 12px 25px;
  font-family: monospace;
  cursor: pointer;
}

button:hover {
  background: #222;
  color: white;
}

.warning {
  margin-top: 50px;
  color: #555;
  font-size: 12px;
  line-height: 1.8;
}

footer {
  margin-top: 80px;
  border-top: 1px solid #222;
  padding-top: 20px;
  color: #444;
  font-size: 11px;
}
</style>
</head>

<body>

<header>

<div class="logo">
H-NET
</div>

<a class="login" href="login.html">
LOGIN
</a>

</header>

<div class="container">

<h1>CONTRACT NETWORK</h1>

<div class="subtitle">
PRIVATE REQUEST SERVICE
</div>

<div class="panel">

<h2>NEW REQUEST</h2>

<label>REQUEST TYPE</label>
<input type="text">

<label>TARGET</label>
<input type="text">

<label>DETAILS</label>
<textarea></textarea>

<label>CONTACT</label>
<input type="text">

<button onclick="sendRequest()">
SUBMIT REQUEST
</button>

<div id="message"></div>

</div>

<div class="warning">

THIS SERVICE IS NOT INTENDED FOR PUBLIC USE.<br>
ALL REQUESTS ARE REVIEWED BEFORE ACCEPTANCE.<br>
DO NOT SUBMIT FALSE INFORMATION.

</div>

<footer>
H-NET / CONTRACT NETWORK<br>
PRIVATE SYSTEM / ARCHIVED INFRASTRUCTURE
</footer>

</div>

<script>

function sendRequest() {

  document.getElementById("message").innerHTML = `
    <br>
    REQUEST RECEIVED.<br>
    REFERENCE ID：#${Math.floor(Math.random() * 9000 + 1000)}
  `;

}

</script>

</body>
</html>
