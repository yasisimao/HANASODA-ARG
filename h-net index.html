<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H-NET</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #070707;
  color: #bbb;
  font-family: "Times New Roman", "Yu Mincho", "Hiragino Mincho ProN", serif;
}

header {
  height: 70px;
  border-bottom: 1px solid #333;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
}

.logo {
  letter-spacing: 4px;
  color: #ddd;
}


/* 右側のボタン */

.header-buttons {
  display: flex;
  align-items: center;
  gap: 10px;
}

.login,
.back-button {
  color: #aaa;
  text-decoration: none;
  border: 1px solid #555;
  padding: 10px 18px;
  font-family: "Times New Roman", "Yu Mincho", "Hiragino Mincho ProN", serif;
  font-size: 16px;
}

.login:hover,
.back-button:hover {
  color: white;
  border-color: #aaa;
}


/* 戻るボタン */

.back-button {
  font-size: 13px;
  letter-spacing: 1px;
}


.container {
  max-width: 850px;
  margin: 70px auto;
  padding: 30px;
}

h1 {
  font-size: 28px;
  font-weight: normal;
}

.subtitle {
  color: #666;
  margin-bottom: 60px;
}

.panel {
  border: 1px solid #333;
  padding: 30px;
}

.panel h2 {
  font-weight: normal;
  letter-spacing: 2px;
}

label {
  display: block;
  margin-top: 25px;
  margin-bottom: 8px;
  color: #777;
}

input,
textarea,
button {
  font-family: "Times New Roman", "Yu Mincho", "Hiragino Mincho ProN", serif;
}

input,
textarea {
  width: 100%;
  background: #0d0d0d;
  border: 1px solid #444;
  color: #ddd;
  padding: 12px;
}

textarea {
  min-height: 150px;
  resize: vertical;
}

button {
  margin-top: 25px;
  background: #111;
  border: 1px solid #555;
  color: #bbb;
  padding: 12px 25px;
  cursor: pointer;
}

button:hover {
  background: #222;
  color: white;
}

#message {
  margin-top: 25px;
  color: #777;
  line-height: 2;
}

.error {
  color: #8b0000;
}

.warning {
  margin-top: 50px;
  color: #555;
  font-size: 12px;
  line-height: 1.8;
}

footer {
  margin-top: 80px;
  border-top: 1px solid #222;
  padding-top: 20px;
  color: #444;
  font-size: 11px;
}

</style>
</head>

<body>

<header>

  <div class="logo">
    ASSASSCON
  </div>

  <div class="header-buttons">

    <a class="back-button" href="index.html">
      ← 戻る
    </a>

    <a class="login" href="h-net login.html">
      LOGIN
    </a>

  </div>

</header>


<div class="container">

  <h1>依頼ネットワーク</h1>

  <div class="subtitle">
    非公開依頼サービス
  </div>

  <div class="panel">

    <h2>新規依頼</h2>

    <label>依頼者名</label>
    <input type="text">

    <label>依頼内容</label>
    <input type="text">

    <label>対象</label>
    <input type="text">

    <label>詳細</label>
    <textarea></textarea>

    <label>連絡先</label>
    <input type="text">

    <button onclick="sendRequest()">
      依頼を送信
    </button>

    <div id="message"></div>

  </div>

  <div class="warning">

    このサービスは一般公開を目的としていません。<br>
    すべての依頼は受理前に審査されます。<br>
    虚偽の情報を送信しないでください。

  </div>

  <footer>
    ASSASSCON / 依頼ネットワーク<br>
    非公開システム / アーカイブ済みインフラ
  </footer>

</div>


<script>

function sendRequest() {

  document.getElementById("message").innerHTML = `
    <div class="error">
      ERROR : CONNECTION FAILED
    </div>

    <br>

    接続先が応答しません。<br>
    この端末からの依頼は受け付けられません。<br><br>

    CONNECTION : DISCONNECTED
  `;

}

</script>

</body>
</html>
